name: EV Calc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl
      - run: python ev.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.xlsx
