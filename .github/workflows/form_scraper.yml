name: Form Last6

on:
  workflow_dispatch:
  schedule:
    # 每周一 大马 06:00 ≈ UTC 周日 22:00
    - cron: "0 22 * * 0"

permissions:
  contents: read

jobs:
  run-form:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run form_scraper.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python form_scraper.py
