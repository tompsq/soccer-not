name: League Odds

on:
  schedule:
    # 每周一 大马 06:00 = UTC 22:00 周日 → 扫早盘
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan=补早盘 mid=中盘 close=临盘 auto=按星期判断"
        required: true
        type: choice
        options:
          - auto
          - scan
          - close
        default: auto

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run league_odds.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          CLEAR_OLD_CLOSE: "1"
        run: python league_odds.py

      - name: Commit history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add league_history.json || true
          git diff --staged --quiet || git commit -m "update league_history.json"
          git push || true
