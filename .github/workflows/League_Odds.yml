name: League Odds

on:
  schedule:
    - cron: '0 22 * * 1'    # 大马 周二 06:00 早盘
    - cron: '30 18 * * 5'   # 大马 周六 02:30 临盘
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - manual_upcoming

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl
      - name: Run
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python league_odds.py
