name: SofaScore Football Data Fetcher

on:
  workflow_dispatch: # 允许手机端手动触发

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装终极防封依赖库
        # 🔥 核心：用下面这行命令同时安装 requests 和 tls_client 两个库
        run: pip install requests tls_client

      - name: 4. 执行指纹伪造抓取脚本
        run: python scraper.py

      - name: 5. 把抓到的AI特征包打包成附件供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: AI-Football-Ready-Data
          path: ai_football_ready_data.json
