name: SofaScore Football Data Fetcher

on:
  workflow_dispatch: # 手机端手动触发按钮

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: pip install requests

      - name: 4. 强行执行抓取脚本
        env:
          ANTI_BOT_KEY: ${{ secrets.ANTI_BOT_KEY }} # 自动注入你的防封密钥
        run: python scraper.py

      - name: 5. 把抓到的AI特征包打包成附件供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: AI-Football-Ready-Data       # 手机下载时的压缩包名字
          path: ai_football_ready_data.json  # 必须和 Python 代码生成的文件名一字不差
