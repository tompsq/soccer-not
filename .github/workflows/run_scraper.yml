name: Official Football Data Fetcher

on:
  workflow_dispatch: # 允许手机端手动点击运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Excel 编译所需的全部依赖库
        run: pip install requests pandas openpyxl

      - name: 4. 执行官方数据抽取并生成 Excel
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scraper.py

      - name: 5. 把生成的 Excel 报表打包成附件供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: AI-Model-Ready-Excel
          path: Football_AI_Model_Data.xlsx

