name: Run FootyStats Scraper

on:
  workflow_dispatch: # 允许你随时在网页上手动点击运行
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点（UTC 0点）自动运行一次

jobs:
  scrape:
    runs-on: ubuntu-latest
  
    permissions:
      contents: write  # 赋予写入仓库的权限，必须配置此项才能自动提交代码

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install playwright
          playwright install chromium

      - name: 执行抓取脚本
        run: python scraper.py

      - name: 自动提交并推送抓取结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 容灾保护：确保文件或目录存在，防止 git 找不到路径而中断流程
          touch footystats_epl_xg.csv
          mkdir -p history
          
          # 将所有更改添加到暂存区
          git add footystats_epl_xg.csv history/
          
          # 检查是否有文件改动，有改动才提交
          git status
          git diff --staged --quiet || git commit -m "Auto-update FootyStats xG data [skip ci]"
          
          # 推送到主分支
          git push
