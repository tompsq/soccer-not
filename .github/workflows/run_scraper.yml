name: Official Football Data Fetcher

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络请求库
        run: pip install requests

      - name: 4. 执行官方数据抽取
        env:
          ANTI_BOT_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scraper.py

      - name: 5. 把抓到的AI特征包打包成附件供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: AI-Football-Ready-Data
          path: ai_football_ready_data.json
