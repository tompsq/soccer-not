name: Run EPL Data to Telegram

on:
  schedule:
    # 每天定时运行一次（可根据需要修改 Cron 表达式，默认每天早上 8 点 UTC 运行）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动在 GitHub 网页端随时点一下运行

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl curl_cffi

      - name: 运行英超抓取脚本并发送 TG
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python epl_to_excel.py
