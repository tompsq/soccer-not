name: Pinnacle Odds Report

on:
  workflow_dispatch:        # 允许手动触发，方便你测试
  schedule:
    # UTC 时间每 6 小时跑一次（北京时间 0点/6点/12点/18点）
    - cron: '0 0,6,12,18 * * *'

jobs:
  run-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 防止卡死一直烧 Actions 额度

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright browsers and system deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Pinnacle odds script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scores_weekly.py
