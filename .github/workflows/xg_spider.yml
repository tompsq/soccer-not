name: Run Playwright EPL xG Spider

on:
  schedule:
    - cron: '0 8 * * *'  # 每天北京时间下午 16:00 运行（可根据需要自行调整）
  workflow_dispatch:     # 支持手动随时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl playwright

    - name: 安装 Playwright 浏览器内核及系统依赖
      run: |
        playwright install chromium --with-deps

    - name: 运行 xG 抓取脚本
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python scrape_sofascore.py
