name: Football Odds and Results Notifier

on:
  # 1. 自动定时运行（例如每天北京时间中午 12:00 和晚上 22:00 自动跑）
  schedule:
    - cron: '0 4,14 * * *'  # UTC 4:00 (北京时间 12:00) 和 UTC 14:00 (北京时间 22:00)
  
  # 2. 支持手动触发，带有运行模式选择框
  workflow_dispatch:
    inputs:
      run_mode:
        description: '选择运行模式 (auto: 自动早盘与完场 / manual: 即时当日盘口)'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - auto

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'auto' }}
        run: |
          python odds_weekly.py
