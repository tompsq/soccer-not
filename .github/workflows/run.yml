name: Football Odds & Results Bot

on:
  schedule:
    # UTC 时间每周二 12:00 (相当于 UTC+8 北京/马来西亚时间每周二 20:00)
    - cron: '0 12 * * 2'
  workflow_dispatch: # 支持手动触发

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 判断触发来源：如果是手动点击触发，github.event_name 就是 'workflow_dispatch'
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
        run: python main.py
