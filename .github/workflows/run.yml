name: Football Odds Bot

on:
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: '选择运行模式 (manual: 当日所有赛事 / upcoming: 未来2小时内赛事 / auto: 全部历史+早盘)'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - upcoming
          - auto
  schedule:
    - cron: '0 0 * * *' # 每天定时自动运行 (默认走 auto 模式)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.RUN_MODE || 'auto' }}
        run: python main.py
