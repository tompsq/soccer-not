name: Auto Fetch Advanced Football Data

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 00:00 自动触发运行
  workflow_dispatch:      # 支持手动一键点击运行

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install understat aiohttp pandas openpyxl

      - name: 运行数据抓取脚本
        run: python fetch_understat_data.py

      - name: 将更新后的 Excel 自动提交保存到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add understat_epl_advanced.xlsx
          git commit -m "Auto update advanced stats [skip ci]" || exit 0
          git push
